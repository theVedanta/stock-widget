# Generate the Xcode project with: brew install xcodegen && xcodegen
# Then set DEVELOPMENT_TEAM and replace com.example.stockwidget / group.com.example.stockwidget
# (also in Shared/Services/AppGroup.swift).
name: StockWidget
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  StockWidget:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: PortfolioWidgetExtension
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
    entitlements:
      path: App/StockWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.stockwidget]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.example.stockwidget.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stockwidget

  PortfolioWidgetExtension:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Portfolio
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PortfolioWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.stockwidget]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.example.stockwidget.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.stockwidget.widget
